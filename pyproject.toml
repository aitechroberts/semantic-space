[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-space"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "cmake>=4.3.1",
    "dill>=0.4.1",
    "distinctipy>=1.3.4",
    "faiss-cpu>=1.13.2",
    "h5py>=3.16.0",
    "huggingface-hub>=1.10.1",
    "hydra-core>=1.3.2",
    "imageio>=2.37.3",
    "kornia>=0.8.2",
    "matplotlib>=3.10.8",
    "natsort>=8.4.0",
    "ninja>=1.13.0",
    "numpy>=1.24,<2.3",
    "open-clip-torch>=3.3.0",
    "open3d>=0.19.0",
    "openai>=2.31.0",
    "plotly>=6.7.0",
    "plyfile>=1.1.3",
    "pyliblzfse>=0.4.1",
    "pypng>=0.20220715.0",
    "pyyaml>=6.0.3",
    "rerun-sdk>=0.31.2",
    "scipy>=1.17.1",
    "sentence-transformers>=5.4.1",
    "supervision>=0.27.0.post2",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
    "transformers>=5.5.3",
    "trimesh>=4.11.5",
    "tyro>=1.0.12",
    "ultralytics>=8.4.37",
    "vllm==0.19.1",
    "wandb>=0.18.3",
    "weave>=0.34.0",
]


[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.workspace]
members = [
    "z_evaluations",
]

[tool.setuptools]

# Tell setuptools to *find only* the semgraph package, and ignore others like "assets"
[tool.setuptools.packages.find]
include = ["semgraph*"]
exclude = ["tests*", "assets*", "docs*", "scripts*"]

# Ship packaged prompt-bundle YAMLs inside wheels. Without this block,
# `pip install semantic-space` (or any non-editable install) would load
# the package and then FileNotFoundError on the first get_prompt_bundle()
# call because setuptools' default behavior excludes non-.py files.
[tool.setuptools.package-data]
"semgraph.prompting" = ["data/*.yaml"]

# Register internal prompt bundles through the same entry-point mechanism
# third parties use. Dogfoods the discovery path (structural shadow-check
# in semgraph.prompting._discover_plugins enforces internal-name precedence
# regardless of iteration order).
[project.entry-points."semgraph.prompt_bundles"]
standard = "semgraph.prompting.standard:StandardPromptBundle"
rich = "semgraph.prompting.rich:RichPromptBundle"
compact = "semgraph.prompting.compact:CompactPromptBundle"
