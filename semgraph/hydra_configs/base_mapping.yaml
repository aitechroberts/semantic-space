defaults:
  - base_paths

# dataset info
dataset_root: null
dataset_config: null
scene_id: null
start: 0
end: -1
stride: 50
image_height: null # if null, it will be determined by dataconfig
image_width: null # if null, it will be determined by dataconfig

make_edges: !!bool False

periodically_save_pcd: !!bool False
periodically_save_pcd_interval: 10

# Input detections
detections_exp_suffix: exp_base_detections_suffix
# gsa_variant: ram
# detection_folder_name: gsa_detections_${gsa_variant}
# det_vis_folder_name: gsa_vis_${gsa_variant}
# color_file_name: gsa_classes_${gsa_variant}


# This json file controls an early exit feature for the mapping scripts. Specifically, it is periodically checked at every iteration of the loops within 'realtime_mapping.py' and 'streamlined_mapping.py'. When the 'exit_early' entry is set to true, these scripts will bypass their normal iterative processing loop and proceed directly to their final frame processing and cleanup phase. This allows for a quick termination of the mapping process, which can be useful in scenarios where immediate results are preferred or when it's necessary to halt processing due to external constraints. To trigger an early exit, manually edit this file by changing the value of 'exit_early' from false to true. The change will take effect at the next loop iteration.
exit_early_file: ${repo_root}/semgraph/hydra_configs/early_exit.json

device: cuda

use_iou: !!bool True
spatial_sim_type: iou # "iou", "giou", "overlap", "iou_accurate", "giou_accurate"
phys_bias: 0.0
match_method: "sim_sum" # "sep_thresh", "sim_sum"
# Only when match_method=="sep_thresh"
semantic_threshold: 0.5
physical_threshold: 0.5
# Only when match_method=="sim_sum"
sim_threshold: 1.2

# 3D bbox IoU OR-condition for merging (Sparse3DPR Eq. 7)
# Set to 0.25 for sparse mode, 0 to disable
iou_merge_kappa: 0.25

# For contain_number
use_contain_number: !!bool False
contain_area_thresh: 0.95
contain_mismatch_penalty: 0.5

# Pipeline geometry mode: "trajectory" (RGBD depth unprojection, default)
#                        "gt_mesh"    (ground-truth mesh vertex lookup)
#                        "sparse"     (DUSt3R RGB-only point map lifting)
pipeline_mode: ${oc.env:PIPELINE_MODE,trajectory}

# Segmentation backend: "sam_auto"       (class-agnostic SAM 2.1 automatic mask generation)
#                       "sam3_auto"      (class-agnostic SAM 3 automatic mask generation)
#                       "detect_sam"     (detector via detector_type + SAM 2.1 box-prompted)
#                       "detect_sam3"    (detector via detector_type + SAM 3 box-prompted)
#                       "gt_instances"   (ground-truth instance labels from mesh — gt_mesh mode only)
segmentation_backend: sam_auto

# Detector registry (only used when segmentation_backend starts with detect_)
# detector_type selects the backend; detector_name selects weights/model ID.
# When detector_name is null the default weights for that type are used.
detector_type: ${oc.env:DETECTOR_TYPE,yoloe}        # yoloe | yolo_world | florence2 | gdino
detector_name: ${oc.env:DETECTOR_NAME,}             # null = use default weights for detector_type

# Selection criteria on the 2D masks (used by all backends)
mask_area_threshold: 25 # mask with pixel area less than this will be skipped
mask_conf_threshold: 0.25 # confidence floor; semantics vary: SAM auto → IoU score, detect_* → detector confidence, Florence-2 → hardcoded 1.0 (no-op)
max_bbox_area_ratio: 0.9 # boxes with larger areas than this will be skipped

# SAM automatic mode filter parameters (sam_auto backend only)
sam_auto_min_mask_area_pixels: 100      # drop tiny fragment masks
sam_auto_max_mask_area_fraction: 0.95   # drop masks covering nearly the entire frame
sam_auto_nms_iou_threshold: 0.7         # NMS IoU threshold for heavily overlapping masks

save_raw_detections: !!bool False       # write raw_detections/ npz+json per frame (large; disable to save disk)

# Frame selection — controls which frames detect.py processes.
# For oracle runs, set method=stride stride=1 to process every frame.
# For ablations, use fps_pose with n_frames=K.
#   Hydra override example: frame_selection.method=fps_pose frame_selection.n_frames=30
frame_selection:
  method: stride
  stride: ${stride}   # backward-compatible: defaults to the top-level stride

min_points_threshold: 16 # projected and sampled pcd with less points will be skipped

# point cloud processing
obj_pcd_max_points: 5000 # Determines the maximum point count for object point clouds; exceeding this triggers downsampling to approx max points. Set to -1 to disable.
downsample_voxel_size: 0.025
dbscan_remove_noise: !!bool True
dbscan_eps: 0.1
dbscan_min_points: 10

# Selection criteria of the fused object point cloud
obj_min_points: 0
obj_min_detections: 3

# Auto-filter presets for sam_auto / sam3_auto backends.
# Selected automatically based on frame count, or forced via auto_filter_preset.
auto_filter_preset: null   # null = auto-select; or "sparse", "moderate", "dense"
auto_filter_presets:
  sparse:
    obj_min_detections: 1
    obj_min_points: 16
  moderate:
    obj_min_detections: 2
    obj_min_points: 100
  dense:
    obj_min_detections: 3
    obj_min_points: 250

# For merge_overlap_objects() function
merge_overlap_thresh: 0.7      # -1 means do not perform the merge_overlap_objects()
merge_visual_sim_thresh: 0.7   # Merge only if the visual similarity is larger
merge_text_sim_thresh: 0.7     # Merge only if the text cosine sim is larger

# Periodically perform post-process operations every k frame
# -1 means not perform them during the run. They are performed at the end anyway. 

denoise_interval: 20           # Run DBSCAN every k frame. This operation is heavy
filter_interval: -1            # Filter objects that have too few associations or are too small
merge_interval: -1             # Merge objects based on geometric and semantic similarity
run_denoise_final_frame: !!bool True
run_filter_final_frame: !!bool True
run_merge_final_frame: !!bool True

# Output point cloud
save_pcd: !!bool True
save_json: !!bool True
save_suffix: exp_streamlined_mapping_base_suffix

# Visualization
vis_render: !!bool True           # If True, the objects will be rendered to a video. 
debug_render: !!bool False     # If True, the vis.run() will be called and used for debugging
class_agnostic: !!bool False   # If set, the color will be set by instance, rather than most common class

save_objects_all_frames: !!bool False   # If True, the objects at all timesteps will be saved for future animation


use_rerun: !!bool False
save_rerun: !!bool False

latest_pcd_filepath: ${repo_root}/latest_pcd_save

# =============================================================================
# gt_mesh mode — ground-truth mesh geometry
# =============================================================================
mesh_path: ${oc.env:MESH_PATH,}
mesh_format: ${oc.env:MESH_FORMAT,replica}       # "replica", "scannetpp", "ai2thor", "matterport"
instance_label_key: "objectId"
instance_class_map: ${oc.env:INSTANCE_CLASS_MAP,}
gt_mesh_best_views_k: 5
gt_mesh_crop_scale: 1.5
gt_mesh_min_visible_points: 50

# =============================================================================
# sparse mode — DUSt3R RGB-only reconstruction
# =============================================================================
image_dir: ${oc.env:IMAGE_DIR,}
dust3r_model: ${oc.env:DUST3R_MODEL,naver/DUSt3R_ViTLarge_BaseDecoder_512_dpt}
dust3r_image_size: 512
dust3r_batch_size: 1
dust3r_niter: 300
dust3r_schedule: "cosine"
dust3r_lr: 0.01
dust3r_scene_graph: "complete"     # "complete", "swin", "logwin" (for >20 images)
dust3r_min_confidence: 0.5